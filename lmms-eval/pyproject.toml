[tool.black]
line-length = 240

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmms_eval"
version = "0.7.1"
authors = [
    { name = "LMMMs-Lab Evaluation Team", email = "lmms-lab@outlook.com" },
]
description = "A framework for evaluating large multi-modality language models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.29.1",
    "calflops>=0.3.2",
    "datasets>=2.19.0",
    "dill",
    "evaluate>=0.4.0",
    "filelock",
    "huggingface-hub",
    "Jinja2",
    "loguru",
    "numpy>=1.26.4",
    "packaging",
    "pandas",
    "peft>=0.2.0",
    "pillow",
    "pycocoevalcap",
    "pytablewriter",
    "pytz",
    "pyyaml",
    "sacrebleu>=1.5.0",
    "scikit-learn>=0.24.1",
    "sentencepiece",
    "tenacity>=8.3.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "tqdm",
    "transformers>=4.39.2",
    "av<16.0.0",
]

[project.optional-dependencies]
reporting = [
    "wandb>=0.13.6",
]
video = [
    "decord; platform_system != 'Darwin'",
    "eva-decord; platform_system == 'Darwin' and python_version < '3.12'",
]

[tool.setuptools.package-data]
"lmms_eval" = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.txt"]

[tool.setuptools.packages.find]
include = ["lmms_eval*"]
exclude = [
    "assets*",
    "benchmark*",
    "docs",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
    "checkpoints*",
    "project_checkpoints*",
    "debug_checkpoints*",
    "mlx_configs*",
    "wandb*",
    "notebooks*",
    "logs*",
]

[tool.wheel]
exclude = [
    "assets*",
    "benchmark*",
    "docs",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
    "checkpoints*",
    "project_checkpoints*",
    "debug_checkpoints*",
    "mlx_configs*",
    "wandb*",
    "notebooks*",
    "logs*",
]

[project.scripts]
lmms-eval = "lmms_eval.cli.dispatch:main"

[project.urls]
Homepage = "https://lmms-lab.github.io"
Repository = "https://github.com/EvolvingLMMs-Lab/lmms-eval"
